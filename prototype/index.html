<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roots tree prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Roots, Forest and gilt. One visual world (paper), single theme by choice.
   Layout idea: the person in the middle stands on a ground line; ancestors grow below as gold roots,
   descendants above as ink branches; far branches fold into buds. */
:root {
  --paper: #EEEBE3;
  --card: #F8F6F1;
  --ink: #1D2B24;
  --ink-soft: #4A564F;
  --bg: #D2D9CD;
  --soil: #6B5524;
  --year: #8A6A22;
  --line: rgba(29, 43, 36, .14);
  --gilt: #A9822F;
  --gilt-light: #C9A35A;
  --forest: #17241E;
  --forest-raised: #23362C;
  --bone: #E8E2D2;
  --font-ui: "Jost", "Futura", "Avenir Next", system-ui, sans-serif;
  --font-story: "Newsreader", "Iowan Old Style", Georgia, serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gilt); outline-offset: 2px; }

/* ---------- top bar ---------- */
.topbar { position: fixed; inset: 0 0 auto 0; height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 16px; z-index: 20;
  background: linear-gradient(var(--bg) 60%, transparent); }
.topbar .logo { height: 34px; width: auto; display: block; }
.topbar .spacer { flex: 1; }
.iconbtn { height: 40px; min-width: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.iconbtn:hover { border-color: rgba(29, 43, 36, .3); }
.iconbtn svg { width: 18px; height: 18px; flex: none; }
.iconbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.primary { height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: var(--ink); color: var(--paper); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; font-size: 14px; }
.primary:hover { background: #2c4036; }
.primary svg { width: 18px; height: 18px; }
@media (max-width: 640px) {
  .topbar { gap: 8px; padding: 0 10px; }
  .topbar .logo { height: 28px; }
  .iconbtn .lbl, .primary .lbl-long { display: none; }
  .iconbtn { padding: 0; width: 40px; justify-content: center; }
}

/* ---------- stage ---------- */
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke-linecap: round; }
.edge.branch { stroke: var(--ink); }
.edge.root { stroke: var(--gilt); }
.edge.dashed { stroke-dasharray: none; }
.edge.partner { stroke: var(--ink); stroke-width: 1.6; }
.edge.partner.former { opacity: .45; }
.edge.stem { stroke: var(--ink-soft); stroke-width: 1.4; opacity: .7; }
.ground { stroke: var(--ink); stroke-opacity: .32; stroke-width: 1.5; }
.soilband { fill: var(--soil); fill-opacity: .09; }
.ring { fill: none; stroke: var(--ink); stroke-opacity: .06; }

.node { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
.card { position: absolute; transform: translate(-50%, -50%); width: 180px; height: 70px; padding: 8px 12px 8px 10px; border-radius: 14px; border: 1px solid rgba(29, 43, 36, .14);
  background: #FFFDF9; color: var(--ink); display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer;
  box-shadow: 0 1px 2px rgba(23, 36, 30, .08), 0 4px 12px rgba(23, 36, 30, .06); transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s; }
.card:hover { border-color: rgba(29, 43, 36, .4); }
.card.selected { transform: translate(-50%, -50%) scale(1.06); box-shadow: 0 12px 30px rgba(23, 36, 30, .2); border-color: var(--ink); z-index: 2; }
.card .av { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 500; background: #E7E4DA; color: var(--ink); }
.card .txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.card .nm { font-weight: 500; font-size: 14px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .yr { font-size: 11.5px; color: var(--year); font-variant-numeric: tabular-nums; line-height: 1.2; }
.card .rl { font-size: 12px; color: var(--ink-soft); line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card.deceased .av { background: #F1E7CF; color: #7A5D1E; }
.card.focus { width: 210px; height: 82px; border: 2px solid var(--gilt); background: #FFFFFF; box-shadow: 0 0 0 6px rgba(169, 130, 47, .16), 0 10px 26px rgba(23, 36, 30, .16); }
.card.focus .av { width: 42px; height: 42px; font-size: 15px; background: var(--ink); color: #FFFDF9; }
.card.focus .nm { font-size: 16px; }
.card.placeholder { border: 1.5px dashed rgba(29, 43, 36, .45); background: rgba(255, 255, 255, .3); color: var(--ink); box-shadow: none; }
.card.placeholder .rl { color: var(--ink-soft); }
.card.placeholder .av { background: transparent; border: 1.5px dashed rgba(29, 43, 36, .5); color: var(--ink); }
.card.pending { border: 1.5px dashed var(--gilt); background: #FFF9EC; }
.card .tag { position: absolute; top: -9px; right: 10px; font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 8px; background: var(--gilt); color: #fff; font-weight: 500; }
.card .twice { position: absolute; bottom: -9px; right: 10px; height: 18px; padding: 0 6px; border-radius: 9px; background: #FFFDF9; border: 1px solid rgba(29, 43, 36, .18); display: flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--ink-soft); }
.card .twice svg { width: 16px; height: 10px; }

.bud { position: absolute; transform: translate(-50%, -50%); height: 30px; padding: 0 12px 0 8px; border-radius: 15px; border: 1px solid rgba(169, 130, 47, .55); background: #FBF6E9;
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; cursor: pointer; color: var(--ink); transition: background .2s, transform .2s var(--ease); }
.bud:hover { background: #F5EBD2; transform: translate(-50%, -50%) scale(1.04); }
.bud svg { width: 16px; height: 16px; color: var(--gilt); }
.bud.open { border-color: var(--line); background: var(--card); color: var(--ink-soft); }
.fold { position: absolute; width: 24px; height: 24px; border-radius: 12px; border: 1px solid rgba(169, 130, 47, .6); background: #FBF6E9; display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--gilt); }
.fold svg { width: 14px; height: 14px; }
.fold:hover { background: #F5EBD2; }
.bud .n { font-variant-numeric: tabular-nums; color: var(--ink-soft); }

/* ---------- floating controls ---------- */
.zoomctl { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 15; }
.builtby { position: fixed; left: 16px; bottom: 14px; z-index: 15; font-size: 12px; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; }
.builtby svg { width: 22px; height: 14px; }
.builtby button { border: 0; background: none; padding: 4px 6px; border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(29, 43, 36, .25); }
.sample { position: fixed; left: 18px; top: 58px; z-index: 14; font-size: 11.5px; color: var(--ink-soft); letter-spacing: .02em; }

/* ---------- pop-out panel ---------- */
.scrim { position: fixed; inset: 0; background: rgba(23, 36, 30, .18); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease); z-index: 30; }
.scrim.on { opacity: 1; pointer-events: auto; }
.panel { position: fixed; z-index: 31; background: #FBFAF6; box-shadow: 0 24px 60px rgba(23, 36, 30, .22); display: flex; flex-direction: column; overflow: hidden;
  top: 76px; right: 16px; bottom: 16px; width: 380px; border-radius: 22px; transform: translateX(24px) scale(.97); opacity: 0; pointer-events: none;
  transition: transform .34s var(--ease), opacity .24s var(--ease); }
.panel.on { transform: none; opacity: 1; pointer-events: auto; }
@media (max-width: 700px) {
  .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 82vh; transform: translateY(40px); }
  .panel.on { transform: none; }
}
.panel .head { padding: 20px 20px 16px; display: flex; gap: 14px; align-items: center; border-bottom: 1px solid var(--line); }
.panel .head .av { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; font-weight: 500; background: #E7E4DA; color: var(--ink); flex: none; }
.panel h2 { margin: 0; font-weight: 500; font-size: 21px; line-height: 1.2; text-wrap: balance; }
.panel .sub { color: var(--ink-soft); font-size: 13.5px; margin-top: 3px; }
.panel .x { margin-left: auto; align-self: flex-start; width: 36px; height: 36px; border-radius: 18px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; }
.panel .x:hover { background: rgba(29, 43, 36, .07); }
.panel .x svg { width: 18px; height: 18px; }
.panel .body { padding: 16px 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
.panel .foot { padding: 12px 16px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
.panel .foot .primary, .panel .foot .iconbtn { flex: 1 1 auto; justify-content: center; }
.facts { display: grid; grid-template-columns: 76px 1fr; gap: 8px 12px; margin: 0; font-size: 14px; }
.facts dt { color: var(--ink-soft); }
.facts dd { margin: 0; }
.story { font-family: var(--font-story); font-size: 16.5px; line-height: 1.5; margin: 0; }
.private { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: #F1EEE6; font-size: 13.5px; color: var(--ink-soft); line-height: 1.45; }
.private svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.photo { aspect-ratio: 1; border-radius: 10px; background: linear-gradient(160deg, #D9CFB8, #B9A981); position: relative; overflow: hidden; }
.photo::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 0; height: 52%; border-radius: 50% 50% 0 0; background: rgba(60, 48, 25, .28); }
.photo::before { content: ""; position: absolute; left: 38%; width: 24%; top: 22%; aspect-ratio: 1; border-radius: 50%; background: rgba(60, 48, 25, .28); }
.photo.add { background: transparent; border: 1.5px dashed rgba(29, 43, 36, .25); display: grid; place-items: center; color: var(--ink-soft); font-size: 12.5px; cursor: pointer; }
.photo.add::before, .photo.add::after { display: none; }
.prov { font-size: 12.5px; color: var(--ink-soft); }
.label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }
.key { display: flex; flex-direction: column; gap: 4px; }
.key h3 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; margin: 10px 0 6px; }
.key h3:first-child { margin-top: 0; }
.krow { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: center; padding: 6px 0; font-size: 14px; line-height: 1.35; }
.krow svg { width: 92px; height: 34px; display: block; }
.krow small { display: block; color: var(--ink-soft); font-size: 12.5px; }
.twicebox { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); font-size: 13.5px; }
.twicebox svg { width: 28px; height: 18px; flex: none; }

/* forms */
.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lab { font-size: 13px; color: var(--ink-soft); }
.field input, .field textarea, .field select { font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(29, 43, 36, .2); background: #fff; color: var(--ink); width: 100%; }
.field textarea { min-height: 84px; resize: vertical; font-family: var(--font-story); font-size: 16px; line-height: 1.45; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 8px 14px; border-radius: 18px; border: 1px solid rgba(29, 43, 36, .2); background: #fff; cursor: pointer; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.hint { font-size: 12.5px; color: var(--ink-soft); line-height: 1.4; }

/* ---------- full-screen pages ---------- */
.page { position: fixed; inset: 0; z-index: 50; background: var(--paper); display: grid; place-items: center; padding: 24px 16px; overflow-y: auto;
  opacity: 0; pointer-events: none; transition: opacity .35s var(--ease); }
.page.on { opacity: 1; pointer-events: auto; }
.page .inner { width: min(560px, 100%); display: flex; flex-direction: column; gap: 18px; transform: translateY(14px); transition: transform .45s var(--ease); }
.page.on .inner { transform: none; }
.page h1 { font-weight: 500; font-size: clamp(26px, 5vw, 34px); line-height: 1.15; margin: 0; text-wrap: balance; }
.page p { margin: 0; line-height: 1.55; }
.page .lede { font-family: var(--font-story); font-size: 19px; line-height: 1.55; }
.page .placeholder-copy { border-left: 2px solid var(--gilt); padding: 4px 0 4px 14px; color: var(--ink-soft); font-family: var(--font-story); font-size: 17px; font-style: italic; }
.page .sig { font-family: var(--font-story); font-size: 18px; }
.page .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.page .linkbtn { border: 0; background: none; color: var(--ink-soft); cursor: pointer; padding: 8px; text-decoration: underline; text-underline-offset: 3px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(29, 43, 36, .18); }
.dots i.on { background: var(--ink); }
.howto { display: flex; flex-direction: column; gap: 14px; margin: 4px 0; padding: 0; list-style: none; }
.howto li { display: flex; gap: 14px; align-items: flex-start; }
.howto .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.howto .ic svg { width: 22px; height: 22px; }
.howto b { font-weight: 500; display: block; }
.howto span { color: var(--ink-soft); font-size: 14px; line-height: 1.45; }
.pick { display: flex; flex-direction: column; gap: 6px; max-height: 230px; overflow-y: auto; }
.pick button { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); cursor: pointer; text-align: left; }
.pick button:hover { border-color: rgba(29, 43, 36, .35); }
.pick small { color: var(--ink-soft); }
.sprout { width: 140px; height: 140px; align-self: center; }
.sprout .grow { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.page.on .grow { animation: draw 1.1s var(--ease) both; }
.page.on .grow.d2 { animation-delay: .55s; }
.page.on .grow.d3 { animation-delay: .85s; }
.leafin { transform-box: fill-box; transform-origin: 50% 100%; }
.page.on .leafin { animation: leafin .6s var(--ease) 1.1s both; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes leafin { from { transform: scale(0); opacity: 0; } to { transform: none; opacity: 1; } }
.sendbox { display: flex; flex-direction: column; gap: 10px; }
.linkrow { display: flex; gap: 8px; }
.linkrow input { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(29, 43, 36, .2); background: #fff; color: var(--ink-soft); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: all .3s var(--ease); z-index: 80; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* prototype-only options */
.mock { position: fixed; left: 16px; bottom: 44px; z-index: 16; }
.mock > button { font-size: 12px; height: 28px; padding: 0 10px; border-radius: 14px; border: 1px dashed rgba(29, 43, 36, .3); background: transparent; color: var(--ink-soft); cursor: pointer; }
.mock .menu { position: absolute; left: 0; bottom: 36px; width: 270px; background: #FBFAF6; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 30px rgba(23, 36, 30, .16); padding: 12px; display: none; flex-direction: column; gap: 10px; font-size: 13.5px; }
.mock .menu.on { display: flex; }
.mock label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.mock .menu .seg button { padding: 6px 10px; font-size: 13px; border-radius: 14px; }
.mock .menu .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.mock .menu button { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 10px; cursor: pointer; font-size: 13.5px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-delay: 0s !important; }
}
</style>
</head>

<header class="topbar">
  <svg class="logo" viewBox="4 8 216 112" role="img" aria-label="Roots">
    <path d="M14 32 V82" fill="none" stroke="#1D2B24" stroke-width="7" stroke-linecap="round"/>
    <path d="M14 50 C14 38 24 32 40 32" fill="none" stroke="#1D2B24" stroke-width="7" stroke-linecap="round"/>
    <defs>
      <mask id="lgA" maskUnits="userSpaceOnUse" x="33.5" y="20.5" width="109" height="73"><rect x="33.5" y="20.5" width="109" height="73" fill="#fff"/><path d="M83.50 57.00 A22.5 22.5 0 0 1 106.00 34.50" fill="none" stroke="#000" stroke-width="9.8"/></mask>
      <mask id="lgB" maskUnits="userSpaceOnUse" x="33.5" y="20.5" width="109" height="73"><rect x="33.5" y="20.5" width="109" height="73" fill="#fff"/><path d="M92.50 57.00 A22.5 22.5 0 0 1 70.00 79.50" fill="none" stroke="#000" stroke-width="9.8"/></mask>
    </defs>
    <circle cx="70" cy="57" r="22.5" fill="none" stroke="#1D2B24" stroke-width="7" mask="url(#lgA)"/>
    <circle cx="106" cy="57" r="22.5" fill="none" stroke="#1D2B24" stroke-width="7" mask="url(#lgB)"/>

  </svg>

  <button class="iconbtn" id="btnAll" aria-pressed="false" aria-label="Show all branches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 21V9"/><path d="M12 13c-3 0-5-2-6-5"/><path d="M12 11c3 0 5-2 6-5"/><path d="M12 9c0-2 0-4 0-6"/></svg><span class="lbl">Show all</span></button>

</header>

<div class="sample">Sample family for the prototype</div>

<main id="stage" aria-label="Family tree">
  <div id="world">

const SAMPLE = {

    ['pc', 'raj', 'priya'], ['pc', 'meera', 'priya']

/* =====================================================================
 * Graph
 * ===================================================================== */
let G;
function buildGraph(data) {
  const g = { people: new Map(), parents: new Map(), children: new Map(), partners: new Map(), pcSub: new Map(), pending: new Set() };
  data.people.forEach(p => { g.people.set(p.id, { ...p }); g.parents.set(p.id, []); g.children.set(p.id, []); g.partners.set(p.id, []); });
  data.rels.forEach(([t, a, b, sub, pend]) => {
    if (t === 'partner') { g.partners.get(a).push({ id: b, sub }); g.partners.get(b).push({ id: a, sub }); }
    else { g.parents.get(b).push(a); g.children.get(a).push(b); g.pcSub.set(a + '>' + b, sub || 'biological'); if (pend) g.pending.add(a + '>' + b); }
  });
  return g;
}
const P = id => G.people.get(id);
const parentsOf = id => G.parents.get(id) || [];
const childrenOf = id => G.children.get(id) || [];
const partnersOf = id => G.partners.get(id) || [];
function siblingsOf(id) {
  const mine = parentsOf(id), out = new Map();
  mine.forEach(par => childrenOf(par).forEach(c => { if (c !== id) out.set(c, (out.get(c) || 0) + 1); }));
  return [...out].map(([sid, shared]) => ({ id: sid, half: shared < mine.length || parentsOf(sid).length !== shared }));
}
const isLiving = p => !!p.living || (!p.died && !p.placeholder && !(p.born && +String(p.born).replace(/\D/g, '') < new Date().getFullYear() - 110));
function displayName(p) { return p.placeholder ? 'Unknown' : [p.first, p.last].filter(Boolean).join(' '); }
function initials(p) { return p.placeholder ? '?' : ((p.first || '')[0] || '') + ((p.last || '')[0] || ''); }
function years(p) { if (isLiving(p) || p.placeholder) return ''; const b = p.born ? String(p.born).replace('about ', 'c. ') : '?'; return b + '–' + (p.died || '?'); }

/* Relationship to the viewer, from the shortest path through parent (U), child (D) and partner (P) steps.
   Sex-specific words only for people who have died: living people's sex isn't public. */
function relation(id) {
  const v = STATE.viewer;
  if (id === v) return 'You';
  const prev = new Map([[v, null]]), q = [v];
  while (q.length) {
    const cur = q.shift();
    if (cur === id) break;
    const steps = [...parentsOf(cur).map(x => [x, 'U']), ...childrenOf(cur).map(x => [x, 'D']), ...partnersOf(cur).map(x => [x.id, 'P'])];
    for (const [nx, s] of steps) if (!prev.has(nx)) { prev.set(nx, [cur, s]); q.push(nx); }
  }
  if (!prev.has(id)) return '';
  let path = '', chain = [], cur = id;
  while (prev.get(cur)) { const [from, s] = prev.get(cur); path = s + path; chain.unshift(cur); cur = from; }
  const p = P(id), w = (m, f, n) => (!isLiving(p) && p.sex === 'male') ? m : (!isLiving(p) && p.sex === 'female') ? f : n;
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
  const greatX = (n, word) => cap('great-'.repeat(n) + word);
  if (/^U+$/.test(path)) { const n = path.length; return n === 1 ? w('Father', 'Mother', 'Parent') : greatX(n - 2, w('grandfather', 'grandmother', 'grandparent')); }
  if (/^D+$/.test(path)) { const n = path.length; return n === 1 ? w('Son', 'Daughter', 'Child') : greatX(n - 2, w('grandson', 'granddaughter', 'grandchild')); }
  if (path === 'P') { const sub = (partnersOf(v).find(x => x.id === id) || {}).sub; return sub === 'divorced' ? 'Former partner' : w('Husband', 'Wife', 'Partner'); }
  if (path === 'UD') { const s = siblingsOf(v).find(x => x.id === id); return (s && s.half ? 'Half-' : '') + (s && s.half ? w('brother', 'sister', 'sibling') : w('Brother', 'Sister', 'Sibling')); }
  if (path === 'UUD') return w('Uncle', 'Aunt', "Parent's sibling");
  if (/^UUU+D$/.test(path)) { const n = path.length - 3; return isLiving(p) || !p.sex ? greatX(n - 1, "grandparent's sibling") : greatX(n, w('uncle', 'aunt', '')); }
  if (path === 'UDD') return w('Nephew', 'Niece', "Sibling's child");
  if (path === 'UUDD') return 'Cousin';
  if (path === 'UUUDDD') return 'Second cousin';
  if (path === 'UUDDD' || path === 'UUUDD') return 'Cousin once removed';
  if (path === 'PU') return w('Father-in-law', 'Mother-in-law', 'Parent-in-law');
  if (path === 'PUD' || path === 'UDP') return w('Brother-in-law', 'Sister-in-law', 'Sibling-in-law');
  if (path === 'DP') return w('Son-in-law', 'Daughter-in-law', 'Child-in-law');
  if (path === 'UP') return w('Stepfather', 'Stepmother', 'Step-parent');
  if (path === 'PD') return w('Stepson', 'Stepdaughter', 'Stepchild');
  const via = P(chain[chain.length - 2]);
  const last = path[path.length - 1];
  const word = last === 'U' ? w('father', 'mother', 'parent') : last === 'D' ? w('son', 'daughter', 'child') : w('husband', 'wife', 'partner');
  return (via ? (via.first || 'Unknown') + "'s " : '') + word;
}

/* Someone married into the family who also descends from it: show the "connected twice" mark. */
function ancestorsSet(id, depth = 8) { const s = new Set(); const go = (x, d) => { if (d > depth) return; parentsOf(x).forEach(p => { s.add(p); go(p, d + 1); }); }; go(id, 0); return s; }
function connectedTwice(id) {
  for (const pt of partnersOf(id)) {
    const mine = ancestorsSet(id), theirs = ancestorsSet(pt.id);
    for (const a of mine) if (theirs.has(a)) return { partner: pt.id, ancestor: a };
  }
  return null;
}

/* =====================================================================
 * Layout. Generation g: 0 is the centered person, +1 their parents, -1 their children.
 * Far branches stay folded into buds unless opened (or "Show all" is on).
 * ===================================================================== */
const CW = 180, CH = 70, FW = 210, FH = 82, GAP = 22, CG = 44, ROW = 150, BUDW = 124;
const MAX_UP = 3, MAX_DOWN = 2;
const STATE = { viewer: SAMPLE.viewer, focus: SAMPLE.viewer, open: new Set(), all: false, rootsBelow: true, selected: null };
const isOpen = k => STATE.all || STATE.open.has(k);
const genY = g => (STATE.rootsBelow ? g : -g) * ROW;

function layout() {
  const nodes = new Map(), edges = [], rows = new Map();
  const F = STATE.focus;
  const wOf = id => id === F ? FW : CW;
  const addNode = (id, x, g, extra = {}) => { const n = { id, x, y: genY(g), g, kind: 'person', ...extra }; nodes.set(id, n); return n; };
  const addBud = (key, label, count, x, g, anchor) => { const id = 'bud:' + key; nodes.set(id, { id, key, x, y: genY(g), g, kind: 'bud', label, count, anchor }); edges.push({ id: 'stem:' + key, kind: 'stem', a: anchor, b: id }); };
  const occupy = (g, x0, x1) => { if (!rows.has(g)) rows.set(g, []); rows.get(g).push([x0, x1]); };
  const nodeSpan = n => { const w = n.kind === 'bud' ? BUDW : wOf(n.id); return [n.x - w / 2, n.x + w / 2]; };

  const fits = block => block.every(n => { const [a, b] = nodeSpan(n); return !(rows.get(n.g) || []).some(([x0, x1]) => a < x1 + GAP && b > x0 - GAP); });
  // A bud beside its person if that spot is free; otherwise tucked just off the card, between rows.
  function placeBud(bud, n, dir, vdir) {
    if (fits([bud])) return placeBlock([bud], dir);
    const g = n.g + (vdir * (STATE.rootsBelow ? 1 : -1) > 0 ? 0.5 : -0.5);
    placeBlock([{ ...bud, x: n.x, y: n.y + vdir * (CH / 2 + 26), g }], dir);
  }
  // Place a block (a set of tentative nodes) shifted sideways in `dir` until it clears everything already placed.
  function placeBlock(block, dir) {
    let shift = 0;
    for (let guard = 0; guard < 200; guard++) {
      let moved = false;
      for (const n of block) {
        const [a, b] = nodeSpan(n);
        for (const [x0, x1] of rows.get(n.g) || []) {
          if (a + shift < x1 + GAP && b + shift > x0 - GAP) {
            shift += dir > 0 ? (x1 + GAP) - (a + shift) : -((b + shift) - (x0 - GAP));
            moved = true;
          }
        }
      }
      if (!moved) break;
    }
    block.forEach(n => { n.x += shift; if (n.kind === 'bud') nodes.set(n.id, n); else nodes.set(n.id, n); const [a, b] = nodeSpan(n); occupy(n.g, a, b); });
    return shift;
  }

  /* ---- ancestors: a pedigree that grows away from the centered person ---- */
  function pedExtents(id, depth, side) {
    const t = { id, depth, side, parents: [], extras: [], bud: null };
    const opened = depth < MAX_UP || isOpen('up:' + id);
    const pars = parentsOf(id);
    if (pars.length && opened) {
      const ordered = [...pars].sort((a, b) => (P(a).sex === 'female') - (P(b).sex === 'female'));
      t.parents = ordered.map((pid, i) => pedExtents(pid, depth + 1, ordered.length === 2 ? (i === 0 ? 'left' : 'right') : side));
    } else if (pars.length) t.bud = { key: 'up:' + id, label: 'Earlier generations', count: countAncestors(id) };
    if (depth > 0) {
      const sibs = siblingsOf(id).map(s => s.id);
      const others = partnersOf(id).filter(pt => !childrenOf(id).some(c => parentsOf(c).includes(pt.id) && isOnLine(c))).map(pt => pt.id);
      const sibExtras = [];
      if (sibs.length) { if (isOpen('sib:' + id)) sibExtras.push(...sibs.map(s => ({ id: s }))); else sibExtras.push({ bud: { key: 'sib:' + id, label: sibs.length === 1 ? '1 sibling' : sibs.length + ' siblings', count: '' } }); }
      if (others.length) { if (isOpen('op:' + id)) t.extras.push(...others.map(s => ({ id: s, partnerOf: id }))); else t.extras.push({ bud: { key: 'op:' + id, label: others.length === 1 ? 'Another marriage' : others.length + ' marriages', count: '' } }); }
      t.extras.push(...sibExtras);
    }
    const extraW = t.extras.reduce((s, e) => s + (e.bud ? BUDW : CW) + GAP, 0);
    const half = (id === F ? FW : CW) / 2;
    t.selfL = half + (side === 'left' ? extraW : 0);
    t.selfR = half + (side !== 'left' ? extraW : 0);
    t.L = t.selfL; t.R = t.selfR;
    if (t.parents.length === 2) {
      const [a, b] = t.parents, H = (CW + CG) / 2;
      t.da = Math.max(H, a.R + GAP / 2); t.db = Math.max(H, b.L + GAP / 2);
      t.L = Math.max(t.L, t.da + a.L); t.R = Math.max(t.R, t.db + b.R);
    } else if (t.parents.length === 1) { t.L = Math.max(t.L, t.parents[0].L); t.R = Math.max(t.R, t.parents[0].R); }
    return t;
  }
  const lineSet = new Set([F, ...ancestorsSet(F, 12)]);
  function isOnLine(c) { return lineSet.has(c); }
  function countAncestors(id) { return ancestorsSet(id).size; }
  function pedPlace(t, x, g) {
    if (g > 0) addNode(t.id, x, g, { side: t.side });
    let off = (t.id === F ? FW : CW) / 2 + GAP;
    for (const e of t.extras) {
      const w = e.bud ? BUDW : CW;
      if (e.partnerOf) off += CG - GAP;
      const ex = t.side === 'left' ? x - off - w / 2 : x + off + w / 2;
      if (e.bud) addBud(e.bud.key, e.bud.label, e.bud.count, ex, g, t.id);
      else addNode(e.id, ex, g, { extraOf: t.id, partnerOf: e.partnerOf });
      off += w + GAP;
    }
    if (t.bud) addBud(t.bud.key, t.bud.label, t.bud.count, x, g + 1, t.id);
    if (t.parents.length === 2) { pedPlace(t.parents[0], x - t.da, g + 1); pedPlace(t.parents[1], x + t.db, g + 1); }
    else if (t.parents.length === 1) pedPlace(t.parents[0], x, g + 1);
  }
  const ped = pedExtents(F, 0, 'right');
  addNode(F, 0, 0, { focus: true });
  pedPlace(ped, 0, 0);
  for (const n of nodes.values()) { const [a, b] = nodeSpan(n); occupy(n.g, a, b); }

  /* ---- the centered person's row: former partners left, current partners right ---- */
  const prts = partnersOf(F).filter(pt => !nodes.has(pt.id));
  const current = prts.filter(pt => pt.sub !== 'divorced'), former = prts.filter(pt => pt.sub === 'divorced');
  let rx = FW / 2 + CG, lx = -(FW / 2 + CG);

/* =====================================================================
 * Camera: drag to pan, wheel or pinch to zoom, glide to the centered person.
 * ===================================================================== */
const stage = $('#stage');
const cam = { x: 0, y: 0, s: 1, fx: 0, fy: 0, fs: 1, tx: 0, ty: 0, ts: 1, t0: 0, moving: false };
function applyCam() { world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`; }
function cameraTo(n, instant) {
  if (!n) return;
  const vw = innerWidth, vh = innerHeight;
  const s = cam.ts || (vw < 640 ? .48 : .8);
  const tx = vw / 2 - n.x * s, ty = vh * (STATE.rootsBelow ? .42 : .55) - n.y * s;
  if (instant || reduceMotion) { Object.assign(cam, { x: tx, y: ty, s, tx, ty, ts: s, moving: false }); applyCam(); return; }
  Object.assign(cam, { fx: cam.x, fy: cam.y, fs: cam.s, tx, ty, ts: s, t0: performance.now(), moving: true });
}
function stepCamera(now) {
  if (!cam.moving) return;
  const t = Math.min(1, (now - cam.t0) / 700), k = ease(t);
  cam.x = cam.fx + (cam.tx - cam.fx) * k; cam.y = cam.fy + (cam.ty - cam.fy) * k; cam.s = cam.fs + (cam.ts - cam.fs) * k;
  applyCam();
  if (t >= 1) cam.moving = false;
}
function zoomAt(f, cx, cy) {
  const ns = Math.min(1.8, Math.max(.3, cam.s * f));
  cam.x = cx - (cx - cam.x) * (ns / cam.s); cam.y = cy - (cy - cam.y) * (ns / cam.s); cam.s = ns; cam.ts = ns; cam.moving = false; applyCam();
}
const pointers = new Map(); let pinch = null, dragMoved = false;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  stage.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); dragMoved = false; cam.moving = false;
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; }
  stage.classList.add('dragging');
});
stage.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt(d / pinch.d, (a.x + b.x) / 2, (a.y + b.y) / 2); pinch.d = d; return;
  }
  cam.x += e.clientX - prev.x; cam.y += e.clientY - prev.y; cam.tx = cam.x; cam.ty = cam.y; applyCam();
  if (Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y) > 2) dragMoved = true;
});
const endPtr = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) stage.classList.remove('dragging'); };
stage.addEventListener('pointerup', endPtr); stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * .0015), e.clientX, e.clientY); }, { passive: false });
stage.addEventListener('click', e => { if (!e.target.closest('button') && !dragMoved) closePanel(); });
$('#btnZoomIn').onclick = () => zoomAt(1.2, innerWidth / 2, innerHeight / 2);
$('#btnZoomOut').onclick = () => zoomAt(1 / 1.2, innerWidth / 2, innerHeight / 2);
$('#btnHome').onclick = () => { closePanel(); STATE.focus = STATE.viewer; render(); };

      ${row(keyLine('M6 17 H86', { w: 1.6, dash: '5 5', op: .45, extra: RINGS_MARK(46, 17, .4) }), 'Former partners', 'Divorced or separated. Their children still connect to both.')}
      ${row(keyLine('M8 17 H84', { w: 1.4, dash: '3 4', color: '#55625B' }), 'Bud stem', 'Connects a folded branch to the person it belongs to.')}
      ${STATE.rootsBelow ? row(`<svg viewBox="0 0 92 34" aria-hidden="true"><rect x="0" y="17" width="92" height="17" fill="#6B5524" fill-opacity=".09"/><line x1="0" x2="92" y1="17" y2="17" stroke="#1D2B24" stroke-opacity=".32" stroke-width="1.5"/></svg>`, 'The ground line', 'The centered person stands on it: roots below, branches above.') : ''}
    </div>`);
  $('#pClose').onclick = closePanel;
}
$('#btnKey').onclick = openKey;

$('#btnAll').onclick = () => { STATE.all = !STATE.all; $('#btnAll').setAttribute('aria-pressed', STATE.all); if (!STATE.all) STATE.open.clear(); render({ camera: false }); };

/* ---- intro ---- */
const INTRO = [
  () => `
    <svg viewBox="4 8 216 112" style="width:180px;height:auto" aria-hidden="true">${document.querySelector('.topbar .logo').innerHTML}</svg>
    <h1>Welcome to our family tree.</h1>
    <p class="lede">Why I built this</p>
    <p class="placeholder-copy">[Jonny Ruzicka's story goes here: why this tree, who it's for, and the people we've lost whose names shouldn't disappear with them. A few short paragraphs in his own words.]</p>
    <p class="sig">Jonny Ruzicka</p>`,
  () => `
    <h1>How it works</h1>
    <ul class="howto">
      <li><span class="ic">${ICON.bud.replace('currentColor', '#A9822F')}</span><div><b>Tap anyone to see their story.</b><span>Names, dates and memories for those who've passed. Living relatives show by name only.</span></div></li>
      <li><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#1D2B24" stroke-width="1.8" stroke-linecap="round"><path d="M12 20V10"/><path d="M12 14c-3 0-5-2-6-5"/><path d="M12 12c3 0 5-2 6-5"/></svg></span><div><b>Branches far from the center fold into buds.</b><span>Tap a bud to open it, or use Show all.</span></div></li>
      <li><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#1D2B24" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><div><b>Add who you know.</b><span>Especially the relatives we've lost. A first name is enough to start. Jonny Ruzicka confirms each addition.</span></div></li>
      <li><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#1D2B24" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h3M4 12h3M4 17h3"/><path d="M10 7h10M10 12h10M10 17h10"/></svg></span><div><b>Not sure what a line means?</b><span>Tap Key at the top for every symbol and line type.</span></div></li>
      <li><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#1D2B24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-3-7-7-1z"/></svg></span><div><b>Send it on.</b><span>Every relative who adds a branch fills in a gap nobody else could.</span></div></li>
    </ul>`,
  () => `
    <h1>Which one is you?</h1>
    <p>Pick yourself so the tree knows where you fit. You can skip this and do it when you add someone.</p>
    <div class="field"><label for="iName">Your name</label><input id="iName" placeholder="Start typing" autocomplete="off"></div>
    <div class="pick" id="iList"></div>`
];
let introStep = 0;
function renderIntro() {
  const last = introStep === INTRO.length - 1;
  $('#introInner').innerHTML = INTRO[introStep]() + `
    <div class="actions">
      ${introStep > 0 ? '<button class="iconbtn" id="iBack">Back</button>' : ''}
      <button class="primary" id="iNext">${last ? 'Skip for now' : introStep === 0 ? 'Show me how it works' : 'Next'}</button>
      <span style="flex:1"></span><div class="dots">${INTRO.map((_, i) => `<i class="${i === introStep ? 'on' : ''}"></i>`).join('')}</div>
    </div>`;
  if (introStep > 0) $('#iBack').onclick = () => { introStep--; renderIntro(); };
  $('#iNext').onclick = () => { if (last) finishIntro(); else { introStep++; renderIntro(); } };
  if (last) {
    const list = () => {
      const q = $('#iName').value.toLowerCase().trim();
      const hits = [...G.people.values()].filter(p => !p.placeholder && isLiving(p) && (!q || displayName(p).toLowerCase().includes(q))).slice(0, 6);
      $('#iList').innerHTML = hits.map(p => `<button data-id="${p.id}"><span>${esc(displayName(p))}</span><small>That's me</small></button>`).join('') + '<button data-id="new"><span>I’m not in the tree yet</span><small>Add me</small></button>';
      document.querySelectorAll('#iList button').forEach(b => b.onclick = () => { if (b.dataset.id !== 'new') { STATE.viewer = b.dataset.id; STATE.focus = b.dataset.id; } finishIntro(); });
    };
    $('#iName').oninput = list; list();
  }
}
function openIntro(step = 0) { introStep = step; renderIntro(); showPage('intro'); }
function finishIntro() {
  hidePage('intro');
  try { localStorage.setItem('roots_intro_seen', '1'); } catch (e) {}
  clearTree(); setTimeout(() => render({ camera: 'instant' }), 250);
}
$('#btnHelp').onclick = () => openIntro(1);
$('#btnWhy').onclick = () => openIntro(0);

/* ---- prototype options ---- */
$('#btnMock').onclick = () => { const m = $('#mockMenu'); m.classList.toggle('on'); $('#btnMock').setAttribute('aria-expanded', m.classList.contains('on')); };
$('#optRoots').onchange = e => { STATE.rootsBelow = e.target.checked; clearTree(); render({ camera: 'instant' }); };
$('#optIntro').onclick = () => { $('#mockMenu').classList.remove('on'); clearTree(); openIntro(0); };
$('#optReset').onclick = () => location.reload();
function clearTree() { for (const r of live.values()) r.el.remove(); live.clear(); for (const r of liveEdges.values()) r.el.remove(); liveEdges.clear(); }

/* ---- start ---- */
G = buildGraph(SAMPLE);
cam.ts = cam.s = innerWidth < 640 ? .48 : .8;
let seen = false; try { seen = localStorage.getItem('roots_intro_seen') === '1'; } catch (e) {}
const qs = new URLSearchParams(location.search);
if (qs.has('nointro')) seen = true;
if (seen) render({ camera: 'instant' }); else { render({ camera: 'instant' }); openIntro(0); }
</script>
</body>
</html>
